<!doctype html>
<html lang="en" class="dark">
  <head>

    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary Meta Tags -->
    <title>Taher Jamali | Software Engineer — ML & Platform Security</title>
    <meta name="title" content="Taher Jamali | Software Engineer — ML & Platform Security" />
    <meta name="description" content="I turn manual pentesting into systems that watch themselves. Software engineer building autonomous AI agents, security automation, and reliable distributed systems." />
    <meta name="author" content="Taher Jamali" />
    <meta name="robots" content="index, follow" />

    <!-- TODO: canonical/OG URLs need a real domain — placeholder until one is chosen -->
    <link rel="me" href="https://linkedin.com/in/taher-jamali" />
    <link rel="me" href="https://github.com/TahJam" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Taher Jamali | Software Engineer — ML & Platform Security" />
    <meta property="og:description" content="I turn manual pentesting into systems that watch themselves." />
    <meta property="og:site_name" content="Taher Jamali" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taher Jamali | Software Engineer — ML & Platform Security" />
    <meta name="twitter:description" content="I turn manual pentesting into systems that watch themselves." />

    <!-- Theme & App -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Structured Data (JSON-LD) — minimal until there's real content (articles, credentials) to back richer schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "#website",
          "name": "Taher Jamali",
          "inLanguage": "en",
          "publisher": { "@id": "#person" }
        },
        {
          "@type": "ProfilePage",
          "@id": "#profilepage",
          "mainEntity": { "@id": "#person" }
        },
        {
          "@type": "Person",
          "@id": "#person",
          "name": "Taher Jamali",
          "email": "taher2152@gmail.com",
          "description": "Software engineer building autonomous AI agents, security automation, and reliable distributed systems.",
          "jobTitle": "Software Engineer",
          "knowsAbout": [
            "Multi-Agent AI Systems", "LLM Integration", "RAG", "Model Context Protocol",
            "Penetration Testing", "Security Automation", "Distributed Systems", "Reliability Engineering",
            "React", "Python", "TypeScript"
          ],
          "sameAs": [
            "https://linkedin.com/in/taher-jamali",
            "https://github.com/TahJam"
          ],
          "address": { "@type": "PostalAddress", "addressLocality": "Austin", "addressRegion": "TX", "addressCountry": "US" }
        }
      ]
    }
    </script>
    <!-- Theme detection before first paint (eliminates dark→light FOUC) -->
    <script>
      (function(){var s=localStorage.getItem('theme');var d=s?s==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;var h=document.documentElement;h.classList.toggle('dark',d);h.classList.toggle('light',!d);var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content=d?'dark':'light';var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=d?'#0a0a0a':'#ffffff'})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
